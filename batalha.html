<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Pokemón</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
    <link rel="stylesheet" href="batalha.css">
</head>
<body>
    <header>
        <nav>
            <abbr title="Voltar"><a href="index.html"><span class="material-symbols-outlined">arrow_back</span></a></abbr>
        </nav>
    </header>
    <main>
        <section id="um">
            <div class="playerUm">
                <h1 class="vida" id="hp">100</h1>
                <h2 id="pokemon"></h2>
                <img id="poke-joga" src="" alt="">
            </div>
        </section>
        <section id="dois">
            <div class="cpu">
                <h1 class="vida" id="hp-cpu">100</h1>
                <h2 id="poke-adver">Squirtle</h2>
                <img id="poke-cpu" class="pokemons-luta" src="img/squirtle-adversario-removebg-preview.png" alt="">
            </div>
        </section>
        
        <div id="ataques">            
            <!--<h2 id="mensagem">...</h2>-->
            <button id="ataque">Atacar</button>
            <button>Itens</button>
            <button>Pokemons</button>
            <button>Sair</button>
        </div>
        <div id="opcoes">
            <button id="ataqueUm" onclick="ataqueJogador(10)"></button>
            <button id="ataqueDois" onclick="ataqueJogador(30)"></button>
            <button>-</button>
            <button id="voltar">Voltar</button>
        </div>
        <div id="modal" class="modal">
            <div class="modal-content">
                <p id="modal-texto">Você Ganhou!!Quer batalhar denovo?</p>
                <button id="btnSim">Sim</button>
                <button id="btnNao">Não</button>
            </div>
        </div>
    </main>

    <script src="batalha.js"></script>
</body>
</html>
